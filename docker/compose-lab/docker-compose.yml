services:
  web:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: ikhsankusuma97/devops-learn-jenkins-web:latest
    container_name: compose-nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 64M
  backend:
    build: ./backend
    image: ikhsankusuma97/devops-learn-jenkins-backend:latest
    container_name: compose-backend
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - internal-db-net
    deploy:
      resources:
        limits:
          cpus: '0.6'
          memory: 256M
  db:
    image: postgres:15-alpine
    networks:
      - internal-db-net
    container_name: compose-postgres
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 350M

networks:
  internal-db-net:
    internal: true

volumes:
  pgdata:
